name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Framework source
        uses: actions/checkout@v7
        with:
          repository: helderperez-dev/voodoo
          path: voodoo
      - name: Checkout Store source
        uses: actions/checkout@v7
        with:
          repository: helderperez-dev/voodoo-store
          path: voodoo-store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - run: python scripts/check_skill_compatibility.py
      - run: python scripts/check_skill_examples.py
      - run: python scripts/check_source_drift.py --framework-root voodoo --store-root voodoo-store
      - run: python scripts/generate_architecture_facts.py --framework-root voodoo --store-root voodoo-store --check
      - name: Validate installer dry-run and drift checker
        run: |
          python scripts/install_smoke.py
      - name: Generate deterministic bundle manifest
        run: python scripts/release_manifest.py --output /tmp/voodoo-skills-manifest.json
      - name: Verify deterministic bundle manifest
        run: python scripts/verify_release_manifest.py /tmp/voodoo-skills-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: voodoo-skills-release-manifest
          path: /tmp/voodoo-skills-manifest.json
      - name: Generate bundle SBOM
        run: python scripts/bundle_sbom.py --output /tmp/voodoo-skills-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: voodoo-skills-sbom
          path: /tmp/voodoo-skills-sbom.json
      - name: Attest skills release evidence
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            /tmp/voodoo-skills-manifest.json
            /tmp/voodoo-skills-sbom.json
